<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page extend under the notch / home bar;
       we then pad with safe-area insets in CSS. Pinch-zoom is deliberately NOT disabled. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#84a683">
  <title>Save the Date</title>
  <meta name="description" content="Save the date — you're invited to our wedding.">

  <!-- Google Fonts: Monsieur La Doulaise (script) + Cormorant Garamond (readable serif for details) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Monsieur+La+Doulaise&display=swap">

  <!-- Start fetching the background straight away so it isn't discovered late via CSS -->
  <link rel="preload" as="image" href="Assets/background-web.jpg">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Floating "firefly" motes are injected here by script.js (purely decorative) -->
  <div class="motes" aria-hidden="true"></div>

  <!-- The stage holds the whole animation. State classes are added to it by script.js:
       is-flipped → is-opening → is-flap-open → is-letter-out -->
  <main class="stage" id="stage">
    <div class="scene">
      <!-- Soft shadow on the "ground" beneath the envelope -->
      <div class="ground" aria-hidden="true"></div>

      <!-- The envelope itself: a 3D card with two faces that flips on rotateY -->
      <div class="envelope">

        <!-- ============ FRONT (address side) ============ -->
        <div class="face front">
          <!-- Just the words, "printed" into the textured paper -->
          <p class="front-script">Save the Date</p>

          <!-- Full-size invisible button: the whole front is tappable and keyboard operable -->
          <button class="hit" type="button" id="flipBtn"
                  aria-label="Turn the envelope over"></button>
        </div>

        <!-- ============ BACK (flap side) ============ -->
        <!-- The back is NOT a nested 3D context (transform-style stays flat) – the flap's
             rotateX is flattened onto this face. That avoids Safari flicker from nested
             preserve-3d inside a flipping card. Layer order is controlled by z-index. -->
        <div class="face back" id="back">

          <!-- The letter: outer wrapper does the "settle forward" move, the inner card
               does the "slide up out of the pocket" move. -->
          <div class="letter" id="letter" aria-hidden="true">
            <article class="letter-card" id="letterCard" tabindex="-1" aria-label="Save the date details">
              <p class="eyebrow">Save the Date</p>
              <h1 class="names">Tiana and Kurtis</h1>
              <!-- small botanical divider -->
              <svg class="sprig" viewBox="0 0 120 16" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
                  <path d="M6 8 H50"/><path d="M70 8 H114"/>
                  <path d="M60 3 C56 6 56 10 60 13 C64 10 64 6 60 3Z"/>
                  <path d="M52 8 C49 5 45 5 43 6 C45 9 49 10 52 8Z"/>
                  <path d="M68 8 C71 5 75 5 77 6 C75 9 71 10 68 8Z"/>
                </g>
              </svg>
              <p class="date">15.10.27</p>
              <p class="location">Montrose House, Sutton Forrest</p>
            </article>
          </div>

          <!-- Pocket: the two side folds + bottom fold that hold the letter -->
          <svg class="pocket" viewBox="0 0 100 70" aria-hidden="true">
            <defs>
              <!-- Shared paper texture (fine paper grain), tiled once per envelope width.
                   Also used by the flap below and, via CSS, on the front. -->
              <pattern id="p-paper" patternUnits="userSpaceOnUse" width="66" height="66">
                <image href="Assets/paper-texture.png" width="66" height="66" preserveAspectRatio="none"/>
              </pattern>
              <radialGradient id="g-age" cx="50%" cy="55%" r="75%">
                <stop offset=".55" stop-color="rgba(60,50,10,0)"/><stop offset="1" stop-color="rgba(60,50,10,.32)"/>
              </radialGradient>
              <linearGradient id="g-side-l" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" style="stop-color:var(--env-side-a)"/><stop offset="1" style="stop-color:var(--env-side-b)"/>
              </linearGradient>
              <linearGradient id="g-side-r" x1="1" y1="0" x2="0" y2="0">
                <stop offset="0" style="stop-color:var(--env-side-a)"/><stop offset="1" style="stop-color:var(--env-side-b)"/>
              </linearGradient>
              <linearGradient id="g-bottom" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" style="stop-color:var(--env-bottom-a)"/><stop offset="1" style="stop-color:var(--env-bottom-b)"/>
              </linearGradient>
            </defs>
            <polygon points="0,0 52,38 0,70" fill="url(#g-side-l)"/>
            <polygon points="100,0 48,38 100,70" fill="url(#g-side-r)"/>
            <polygon points="0,70 50,33 100,70" fill="url(#g-bottom)"/>
            <!-- texture over the whole pocket (everything except the open V at the top) -->
            <polygon points="0,0 50,38 100,0 100,70 0,70" fill="url(#p-paper)"/>
            <!-- age: darker, slightly stained edges -->
            <polygon points="0,0 50,38 100,0 100,70 0,70" fill="url(#g-age)"/>
            <!-- fold creases: a dark line with a paper highlight just beside it -->
            <g fill="none" stroke-linecap="round">
              <path d="M0 70 L50 33 L100 70" stroke="rgba(40,60,30,.4)" stroke-width=".5"/>
              <path d="M1 69.6 L50 33.8 L99 69.6" stroke="rgba(255,250,215,.28)" stroke-width=".35"/>
              <path d="M0 0 L50 37" stroke="rgba(40,60,30,.25)" stroke-width=".4"/>
              <path d="M100 0 L50 37" stroke="rgba(40,60,30,.25)" stroke-width=".4"/>
            </g>
          </svg>

          <!-- Top flap, hinged along the top edge. Two artworks are stacked: the outside
               (seen when closed) and the painted liner (seen once it swings past 90°). -->
          <div class="flap" aria-hidden="true">
            <svg class="flap-outer" viewBox="0 0 100 40" preserveAspectRatio="none">
              <defs>
                <linearGradient id="g-flap" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" style="stop-color:var(--env-flap-a)"/><stop offset="1" style="stop-color:var(--env-side-b)"/>
                </linearGradient>
                <filter id="f-soft" x="-10%" y="-10%" width="120%" height="140%">
                  <feGaussianBlur stdDeviation="1.1"/>
                </filter>
              </defs>
              <!-- soft shadow the closed flap casts onto the pocket -->
              <path d="M0 0 L100 0 L54 38.6 Q50 41.6 46 38.6 Z" fill="rgba(30,50,25,.4)" transform="translate(0 1.4)" filter="url(#f-soft)"/>
              <path d="M0 0 L100 0 L53.6 37.6 Q50 40.4 46.4 37.6 Z" fill="url(#g-flap)"/>
              <path d="M0 0 L100 0 L53.6 37.6 Q50 40.4 46.4 37.6 Z" fill="url(#p-paper)"/>
              <path d="M0.6 0.3 L46.6 37.3 Q50 40 53.4 37.3 L99.4 0.3" fill="none" stroke="rgba(255,250,215,.3)" stroke-width=".35"/>
            </svg>
            <svg class="flap-inner" viewBox="0 0 100 40" preserveAspectRatio="none">
              <defs>
                <!-- liner sits inside a thin border of envelope paper -->
                <clipPath id="c-liner"><path d="M4 0 L96 0 L52.6 34.7 Q50 36.8 47.4 34.7 Z"/></clipPath>
              </defs>
              <path d="M0 0 L100 0 L53.6 37.6 Q50 40.4 46.4 37.6 Z" style="fill:var(--env-bottom-a)"/>
              <path d="M0 0 L100 0 L53.6 37.6 Q50 40.4 46.4 37.6 Z" fill="url(#p-paper)"/>
              <!-- The painting is drawn upside down here because the open flap is seen
                   flipped over its hinge; this way it reads the right way up, with the sky
                   at the flap's tip, and carries on seamlessly into the envelope below. -->
              <g clip-path="url(#c-liner)">
                <image href="Assets/liner.jpg" x="0" y="0" width="100" height="110" preserveAspectRatio="none" transform="translate(0 40) scale(1 -1)"/>
              </g>
            </svg>
          </div>

          <!-- Blush pink wax seal: the button you tap to open -->
          <button class="seal" type="button" id="sealBtn" aria-label="Break the wax seal and open the envelope">
            <span class="seal-inner">
              <svg viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                  <!-- lit from the top left, like the paper emboss -->
                  <radialGradient id="g-wax" cx="38%" cy="32%" r="72%">
                    <stop offset="0" stop-color="#fff4f1"/>
                    <stop offset=".4" stop-color="#f8dcd8"/>
                    <stop offset=".8" stop-color="#eac1be"/>
                    <stop offset="1" stop-color="#cf9f9f"/>
                  </radialGradient>
                  <!-- the pressed-in well is lit the opposite way (it's a dip, not a bump) -->
                  <radialGradient id="g-wax-well" cx="62%" cy="68%" r="75%">
                    <stop offset="0" stop-color="#fbe6e3"/>
                    <stop offset=".7" stop-color="#f1cecb"/>
                    <stop offset="1" stop-color="#dfb0ae"/>
                  </radialGradient>
                  <filter id="f-seal-shadow" x="-20%" y="-20%" width="140%" height="150%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
                    <feOffset dy="2.4" result="b"/>
                    <feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer>
                    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <filter id="f-gloss" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.4"/>
                  </filter>
                  <!-- the stamped design: wreath, bows and monogram (drawn twice for the deboss) -->
                  <g id="seal-design">
                    <path fill="none" stroke="currentColor" stroke-width=".9" d="M57 24.5 A26.5 26.5 0 0 1 57 75.5 M43 24.5 A26.5 26.5 0 0 0 43 75.5"/>
                    <g fill="currentColor">
                      <ellipse cx="61.4" cy="25.5" rx="1.7" ry="3.6" transform="rotate(65 61.4 25.5)"/><ellipse cx="67.7" cy="29.6" rx="1.7" ry="3.6" transform="rotate(1 67.7 29.6)"/><ellipse cx="72.6" cy="35.3" rx="1.7" ry="3.6" transform="rotate(97 72.6 35.3)"/><ellipse cx="75.8" cy="42.1" rx="1.7" ry="3.6" transform="rotate(33 75.8 42.1)"/><ellipse cx="77.0" cy="49.5" rx="1.7" ry="3.6" transform="rotate(129 77.0 49.5)"/><ellipse cx="76.1" cy="57.0" rx="1.7" ry="3.6" transform="rotate(65 76.1 57.0)"/><ellipse cx="73.1" cy="63.9" rx="1.7" ry="3.6" transform="rotate(161 73.1 63.9)"/><ellipse cx="68.4" cy="69.7" rx="1.7" ry="3.6" transform="rotate(97 68.4 69.7)"/><ellipse cx="62.3" cy="74.1" rx="1.7" ry="3.6" transform="rotate(193 62.3 74.1)"/>
                      <ellipse cx="38.6" cy="25.5" rx="1.7" ry="3.6" transform="rotate(-65 38.6 25.5)"/><ellipse cx="32.3" cy="29.6" rx="1.7" ry="3.6" transform="rotate(-1 32.3 29.6)"/><ellipse cx="27.4" cy="35.3" rx="1.7" ry="3.6" transform="rotate(-97 27.4 35.3)"/><ellipse cx="24.2" cy="42.1" rx="1.7" ry="3.6" transform="rotate(-33 24.2 42.1)"/><ellipse cx="23.0" cy="49.5" rx="1.7" ry="3.6" transform="rotate(-129 23.0 49.5)"/><ellipse cx="23.9" cy="57.0" rx="1.7" ry="3.6" transform="rotate(-65 23.9 57.0)"/><ellipse cx="26.9" cy="63.9" rx="1.7" ry="3.6" transform="rotate(-161 26.9 63.9)"/><ellipse cx="31.6" cy="69.7" rx="1.7" ry="3.6" transform="rotate(-97 31.6 69.7)"/><ellipse cx="37.7" cy="74.1" rx="1.7" ry="3.6" transform="rotate(-193 37.7 74.1)"/>
                    </g>
                    <!-- little ribbon bows top and bottom -->
                    <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M50 23.5 c-2.5 -3.5 -7 -3 -6.2 0 c.6 2.4 4 2 6.2 0 c2.2 2 5.6 2.4 6.2 0 c.8 -3 -3.7 -3.5 -6.2 0 l-2.6 4.2 M50 23.5 l2.6 4.2"/>
                      <path d="M50 76.5 c-2.5 -3.5 -7 -3 -6.2 0 c.6 2.4 4 2 6.2 0 c2.2 2 5.6 2.4 6.2 0 c.8 -3 -3.7 -3.5 -6.2 0 l-2.6 4.2 M50 76.5 l2.6 4.2"/>
                    </g>
                    <!-- Monogram. Uses the page's Cormorant Garamond font. -->
                    <text x="50" y="56.5" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="600" font-size="17" fill="currentColor">T&amp;K</text>
                  </g>
                </defs>

                <!-- poured wax blob with its shadow -->
                <path filter="url(#f-seal-shadow)" fill="url(#g-wax)" d="M91.9 50.0C92.1 54.1 92.7 58.2 92.4 62.4C92.0 66.7 92.1 72.1 89.8 75.6C87.6 79.1 82.5 81.1 78.8 83.3C75.1 85.4 71.3 86.6 67.5 88.3C63.7 90.0 60.2 92.6 56.3 93.5C52.3 94.4 47.8 94.2 43.7 93.5C39.7 92.8 36.0 90.8 32.1 89.3C28.2 87.7 23.5 86.8 20.3 84.2C17.2 81.7 14.8 77.5 13.1 73.7C11.4 69.9 11.2 65.6 10.2 61.7C9.3 57.7 7.7 54.0 7.4 50.0C7.1 46.0 7.2 41.6 8.5 37.8C9.7 34.1 12.9 31.1 15.0 27.5C17.0 23.9 18.2 19.5 20.8 16.4C23.5 13.2 27.2 9.9 31.0 8.4C34.8 6.9 39.7 7.4 43.9 7.5C48.0 7.5 51.8 8.5 55.9 8.9C60.0 9.2 64.7 8.1 68.5 9.4C72.3 10.8 75.5 14.1 78.7 16.9C81.8 19.7 85.0 22.6 87.2 26.1C89.3 29.6 90.8 33.8 91.6 37.8C92.4 41.8 91.8 45.9 91.9 50.0Z"/>
                <!-- faint ridge where the wax was pushed outward by the stamp -->
                <circle cx="50" cy="50" r="36.5" fill="none" stroke="rgba(255,244,242,.7)" stroke-width="1.6"/>
                <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(175,110,115,.28)" stroke-width="1"/>
                <!-- pressed-in well with its bevelled edge -->
                <circle cx="50" cy="50" r="33" fill="url(#g-wax-well)"/>
                <circle cx="50.7" cy="50.8" r="33" fill="none" stroke="rgba(255,246,244,.9)" stroke-width="1.2"/>
                <circle cx="49.4" cy="49.3" r="33" fill="none" stroke="rgba(160,100,105,.5)" stroke-width="1.3"/>
                <!-- the design, debossed: highlight below-right, shadow edge above-left -->
                <use href="#seal-design" color="rgba(255,246,244,.95)" transform="translate(.55 .65)"/>
                <use href="#seal-design" color="#c48b90"/>
                <!-- soft wet-look gloss on the raised rim -->
                <ellipse cx="33" cy="22" rx="11" ry="4.5" transform="rotate(-35 33 22)" fill="#fff" opacity=".7" filter="url(#f-gloss)"/>
              </svg>
            </span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- Gentle instruction at the bottom of the screen; text updated by script.js.
       aria-live lets screen-reader users hear each new step. -->
  <p class="hint" id="hint" aria-live="polite">Tap the envelope to open</p>

  <!-- If JavaScript is unavailable, still show the details -->
  <noscript>
    <style>.stage, .hint { display: none; }</style>
    <div class="noscript-card">
      <p class="eyebrow">Save the Date</p>
      <p class="names">Tiana and Kurtis</p>
      <p class="date">15.10.27</p>
      <p class="location">Montrose House, Sutton Forrest</p>
    </div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
